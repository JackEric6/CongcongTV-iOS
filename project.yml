name: CongcongTV
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.congcong.tv.ios
    INFOPLIST_FILE: CongcongTV/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CongcongTV:
    type: application
    platform: iOS
    sources:
      - path: CongcongTV
    settings:
      base:
        PRODUCT_NAME: CongcongTV
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
