name: CongcongTV
options:
  bundleIdPrefix: com.congcongtv
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

targets:
  CongcongTV:
    type: application
    platform: iOS
    sources:
      - path: CongcongTV
        # 资源目录单独声明（保持 js/js-rules/config 相对结构），避免被当普通文件夹混进 sources
        excludes:
          - Resources
    resources:
      # 蓝色文件夹引用（folderType: folder）→ bundle 里保留 js/ 与 config/ 目录层级，
      # 代码用 Bundle.main.url(forResource:withExtension:subdirectory:) 原样命中：
      #   js/JSEnv.bundle.js、js/rules/虎牙.js…、config/movie2.json
      - path: CongcongTV/Resources/js
        folderType: folder
      - path: CongcongTV/Resources/config
        folderType: folder
      - path: CongcongTV/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.congcongtv.ios
        PRODUCT_NAME: CongcongTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 丛丛影视
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        # http 直播源 / http 配置地址：全部放行（ATS 例外）
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: true
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  CongcongTV:
    build:
      targets:
        CongcongTV: all
    run:
      config: Debug
    archive:
      config: Release
